<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">AB Layout — Advocate Benefit Layout</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E5BB8"/>
      <stop offset="1" stop-color="#0B2E6B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#F08C00"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04163A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>

  <!-- Legal page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M152 88 H318 L382 152 V404 A24 24 0 0 1 358 428 H152 A24 24 0 0 1 128 404 V112 A24 24 0 0 1 152 88 Z" fill="#FFFFFF"/>
  </g>
  <path d="M318 88 V132 A20 20 0 0 0 338 152 H382 Z" fill="#C7D6F2"/>

  <!-- Neatly aligned text lines (first line indented) -->
  <g fill="#1E4A9A">
    <rect x="196" y="186" width="148" height="18" rx="9"/>
    <rect x="166" y="226" width="178" height="18" rx="9"/>
    <rect x="166" y="266" width="178" height="18" rx="9"/>
    <rect x="166" y="306" width="104" height="18" rx="9"/>
  </g>

  <!-- Scales-of-justice badge -->
  <circle cx="370" cy="378" r="94" fill="#0B2E6B"/>
  <circle cx="370" cy="378" r="82" fill="url(#gold)"/>
  <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M370 326 V426"/>
    <path d="M330 350 H410"/>
    <path d="M346 432 H394"/>
    <path d="M330 350 L312 392 M330 350 L348 392"/>
    <path d="M410 350 L392 392 M410 350 L428 392"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M306 392 H354 A24 24 0 0 1 306 392 Z"/>
    <path d="M386 392 H434 A24 24 0 0 1 386 392 Z"/>
    <circle cx="370" cy="326" r="9"/>
  </g>
</svg>
