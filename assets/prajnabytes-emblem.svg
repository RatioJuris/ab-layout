    #gear-red { transform-origin: 145.5px 381.8px; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .gear { animation: none; }
      .liquid { display: none; }
    }
  </style>
